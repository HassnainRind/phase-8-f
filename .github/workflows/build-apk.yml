name: Build Flutter APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: subosito/flutter-action@v2
        with: { channel: stable }
      - run: flutter create --platforms=android --org com.petalhaven --project-name petalhaven .
      - run: sed -i 's/android:label="[^"]*"/android:label="Petalhaven"/' android/app/src/main/AndroidManifest.xml
      - run: sed -i '0,/<manifest[^>]*>/s//&\n    <uses-permission android:name="android.permission.VIBRATE"\/>/' android/app/src/main/AndroidManifest.xml
      - run: bash tool/patch_android.sh
      - run: flutter pub get
      - run: dart run flutter_launcher_icons
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: Petalhaven-Flutter-APK
          path: build/app/outputs/flutter-apk/app-release.apk
