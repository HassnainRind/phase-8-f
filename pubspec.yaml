name: petalhaven
description: Petalhaven
publish_to: none
version: 1.0.0+1
environment:
  sdk: ">=3.3.0 <4.0.0"
dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.2.3
  url_launcher: ^6.3.0
  flutter_svg: ^2.0.10+1
  share_plus: ^10.0.2
  file_picker: ^8.1.2
  path_provider: ^2.1.4
  audioplayers: ^6.1.0
  vibration: '>=2.0.1 <4.0.0'
dev_dependencies:
  flutter_launcher_icons: ^0.14.1
flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/icon/icon.png
  adaptive_icon_background: "#7A5AD0"
  adaptive_icon_foreground: assets/icon/icon_foreground.png
flutter:
  uses-material-design: true
  assets:
    - assets/media/
    - assets/data/
    - assets/sounds/
  fonts:
    - family: Urbanist
      fonts:
        - asset: assets/fonts/Urbanist-500.ttf
          weight: 500
        - asset: assets/fonts/Urbanist-600.ttf
          weight: 600
        - asset: assets/fonts/Urbanist-700.ttf
          weight: 700
        - asset: assets/fonts/Urbanist-800.ttf
          weight: 800
